{% extends 'layout/base.html' %}

{% block title %} Trang Chu {% endblock %}

{% block content %}
<ul class="pagination mt-2">
  <li class="page-item"><a class="page-link" href="/?page=1">1</a></li>
  <li class="page-item"><a class="page-link" href="/?page=2">2</a></li>
</ul>

{% if products %}
<div class="row">
    {% for p in products %}
    <div class="col-md-3 col-6 p-2">
        <div class="card">
            <img class="card-img-top" src="{{ p.image }}" alt="Card image">
            <div class="card-body">
                <h4 class="card-title">{{ p.name }}</h4>
                <p class="card-text">{{ p.price }} VNĐ</p>
                <a href="#" class="btn btn-primary">Xem chi tiết</a>
                <button href="#" class="btn btn-danger">Đặt hàng</button>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% else %}
<div class="alert alert-warning mt-2">KHÔNG có sản phẩm nào!</div>
{% endif %}
{% endblock %}
